# Self-hosted stack for the AI Impact Awards portal.
# Single VM: 4 vCPU / 8 GB RAM / 40 GB system disk + a ~500 GB volume for MinIO.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: awards
      POSTGRES_PASSWORD: awards
      POSTGRES_DB: awards
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "max_connections=100"
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awards"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 2500M }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    # Bind this to the dedicated data volume on the VM, e.g. /mnt/minio-data:/data
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1G }

  # one-shot: creates the attachments bucket
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/attachments || true"

  app:
    build: { context: ., target: runner }
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    # This self-hosted path uses the bundled Postgres + MinIO, overriding whatever
    # DATABASE_URL / storage vars are in .env (which may point at Neon).
    environment:
      DATABASE_URL: postgres://awards:awards@db:5432/awards
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: attachments
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL_S3: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      NODE_OPTIONS: "--max-old-space-size=1024"
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 2G }

volumes:
  pgdata:
  miniodata:
