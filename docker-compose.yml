# Self-hosted stack — app + Postgres (+ optional MinIO) on one VM.
# 2 vCPU / 4 GB RAM / 40 GB disk is enough: demo videos are links, so object
# storage only holds small supporting files.
#
#   docker compose up -d --build          # start db (+ minio) + app
#   docker compose run --rm migrate       # apply migrations, then seed the bootstrap admin
#
# Using Cloudflare R2 / S3 / Neon for storage instead of MinIO? Delete the
# `minio` + `minio-init` services and set the S3_* / AWS_* vars in .env.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: awards
      POSTGRES_PASSWORD: awards   # change this AND DATABASE_URL below
      POSTGRES_DB: awards
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "max_connections=100"
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awards"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9001:9001"]     # console only; the S3 API is reached via the proxy
    volumes: ["miniodata:/data"]

  # one-shot: creates the attachments bucket
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/attachments || true"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    # Bundled Postgres + MinIO. If S3_ENDPOINT points at MinIO it must be the
    # PUBLIC url the browser can reach (e.g. https://files.yourdomain.com), not
    # http://minio:9000 — presigned download URLs are handed to the browser.
    environment:
      DATABASE_URL: postgres://awards:awards@db:5432/awards
      NODE_OPTIONS: "--max-old-space-size=1024"
    ports: ["127.0.0.1:3000:3000"]   # only the reverse proxy talks to it
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # one-shot: `docker compose run --rm migrate`  (build target has tsx + source)
  migrate:
    build: { context: ., target: build }
    profiles: ["tools"]
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://awards:awards@db:5432/awards
    command: sh -c "npm run db:migrate && npm run db:seed"

volumes:
  pgdata:
  miniodata:
